# Render Blueprint Specification for Resolve AI (100% Free Plan Deployment)
# Co-located in Singapore (singapore) for <10ms round-trip latency to Nexconn Singapore API
databases:
  - name: resolve-ai-db
    databaseName: resolve_ai
    user: resolve_ai_user
    region: singapore
    plan: free # 100% Free Tier (1 GB storage, 256 MB RAM, 30-day initial window)
    ipAllowList: []

services:
  - type: web
    name: resolve-ai-novacart
    runtime: node
    region: singapore
    plan: free # 100% Free Tier (512 MB RAM, 0.1 CPU, zero monthly spend)
    branch: feature/checkpoint-c-storefront-widget
    buildCommand: npm --prefix server install && npm --prefix client install && npm --prefix client run build
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resolve-ai-db
          property: connectionString
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_API_URL
        value: https://api.sg-light-api.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://resolve-ai-novacart.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://resolve-ai-novacart.onrender.com
      - key: WEBHOOK_URL
        value: https://resolve-ai-novacart.onrender.com/api/webhooks/nexconn
      - key: WIDGET_URL
        value: https://resolve-ai-novacart.onrender.com/widget.js
